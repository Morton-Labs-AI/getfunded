[project]
name = "funderdb"
version = "0.1.0"
description = "Open Funder Database — public-data spine ingestion (IRS 990, SEC ADV/Form D, SBIR)"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "lxml>=5.2",
    "stream-unzip>=0.0.101",
    "splink>=4.0.16,<5",
    "duckdb>=1.5.5",
    "pyarrow>=25.0.0",
]

[project.scripts]
funderdb = "funderdb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funderdb"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
