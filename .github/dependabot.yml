version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(web)"
    groups:
      web-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: uv
    directory: /corpus
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(corpus)"
    groups:
      corpus-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
