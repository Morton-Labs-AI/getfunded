name: Weekly search eval

# Funder search, measured the way a grantseeker meets it (apps/web/evals/search).
# Weekly and by hand, never on push: the scorecard goes to the run's artifacts
# and the Digital Command Center reads the result. It calls the public site, so
# it needs no secret; the relevance measures that read funders' grant records
# also run when the repository has an EVAL_TOKEN secret matching an
# EVAL_TOKEN set on the production deployment (see the suite's README).

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:
    inputs:
      sample:
        description: "Cases per suite (blank for the full suite, about 20 minutes at the public rate limit)"
        required: false
        default: "12"

permissions:
  contents: read

concurrency:
  group: weekly-search-eval
  cancel-in-progress: false

jobs:
  eval:
    name: Search eval against getfunded.ai
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # The runner uses only Node's own modules; no npm install.
      - name: Run the suite
        env:
          EVAL_TOKEN: ${{ secrets.EVAL_TOKEN }}
        run: |
          SAMPLE="${{ github.event.inputs.sample || '12' }}"
          ARGS="--target prod --label weekly --save-report --facts-from prod"
          if [ -n "$SAMPLE" ]; then ARGS="$ARGS --sample $SAMPLE"; fi
          node evals/search/run.mjs $ARGS > scorecard.md
      - name: Scorecard to the job summary
        if: always()
        run: cat scorecard.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: search-eval-${{ github.run_id }}
          path: |
            apps/web/scorecard.md
            apps/web/evals/search/out/
            apps/web/evals/search/reports/
          retention-days: 90
