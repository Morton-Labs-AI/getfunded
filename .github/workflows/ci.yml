name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      corpus: ${{ steps.filter.outputs.corpus }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'
            corpus:
              - 'corpus/**'
              - '.github/workflows/ci.yml'

  web:
    name: Web (typecheck, lint, test, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check

  corpus:
    name: Corpus (pytest)
    needs: changes
    if: needs.changes.outputs.corpus == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: corpus
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: corpus/uv.lock
      - run: uv sync
      - run: uv run pytest -q

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check every commit has a Signed-off-by trailer
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list --no-merges "origin/${BASE_REF}..HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::Commit $sha has no Signed-off-by trailer"
              git log -1 --format='  %h %s' "$sha"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo
            echo "Every commit needs a sign-off. Fix with:"
            echo "  git rebase --signoff origin/${BASE_REF} && git push --force-with-lease"
            exit 1
          fi
          echo "All commits are signed off."
